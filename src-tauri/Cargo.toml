[package]
name = "kairos"
description = "Kairos — CAE 仿真软件"
version.workspace = true
edition.workspace = true

[lib]
name = "kairos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bytemuck = "1"
kairos-core = { path = "../src-crates/kairos-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri.workspace = true
pollster = "0.4"
tauri-plugin-dialog = "2"
ureq = "2"
wgpu = "24"

