[package]
name = "kairos-core"
description = "Kairos 领域层：模型、领域服务与求解引擎（不依赖 Tauri / UI，可独立测试与复用）"
version.workspace = true
edition.workspace = true

[lib]
name = "kairos_core"

[dependencies]
serde.workspace = true
serde_json = "1"
csv = "1"
base64 = "0.22"
bytemuck = "1"
ppt-rs = "0.2"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
sha2 = "0.10"

[dev-dependencies]
criterion = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bench]]
name = "ipc_dto"
harness = false

[[bench]]
name = "principal_axis"
harness = false

[[bench]]
name = "kf1_codec"
harness = false
