# CI：三平台各一条流水线（单作业单编译链，避免多作业重复编译）
# 门禁 = bun run verify（typecheck / lint / format / test / 覆盖率 / knip / cargo 同链）

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt, llvm-tools-preview
      - name: 安装 Tauri Linux 依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf unzip
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      # 覆盖率门槛已并入 verify（前端 lib 100% · Rust core 行 100%），须先装 cargo-llvm-cov
      - name: 安装 cargo-llvm-cov（覆盖率门槛依赖）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: 全量门禁（typecheck / lint / format / test / 覆盖率 / knip / Rust 同链）
        run: bun run verify
      - name: 依赖漏洞审计
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo audit
      - name: 性能基准（只记录，不卡点）
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p bench-out
          bun run bench:web > bench-out/bench-web.txt 2>&1
          cargo bench 2>&1 | tee bench-out/bench-rust.txt
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && always()
        with:
          name: bench-report
          path: bench-out/
      # 顺手产物不卡点：Windows 打包器偶发 WiX 下载超时（基础设施抖动）
      - name: 桌面包构建（主干推送时）
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: bun run tauri build
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: kairos-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
