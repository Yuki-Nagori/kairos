# T18 发布流水线：手动触发 → 三平台构建（macOS arm / Windows x64 / Linux x64）→ Release 草稿
# 仅手动运行（Actions 页 → Run workflow，填发布标签如 v0.1.0）；本地验证打包用 bun run tauri build。

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签（如 v0.1.0），草稿 Release 将创建在该标签上
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与上传（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@master
        with:
          # 与 rust-toolchain.toml 钉版一致；否则交叉目标装在默认工具链上，
          # cargo 切到 1.95.0 后找不到 target（同 ci.yml 06:49 的修复）。
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - name: 安装 Tauri Linux 依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: 同步版本号（tag → 三处清单）
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # 去掉 v 前缀，同步 package.json / tauri.conf.json / Cargo.toml；
          # Cargo.lock 里工作区成员的版本由 cargo build 自动改写。
          VERSION="${RELEASE_TAG#v}"
          sed -i.bak 's/"version": "[^"]*"/"version": "'"${VERSION}"'"/' package.json src-tauri/tauri.conf.json
          sed -i.bak 's/^version = "[^"]*"/version = "'"${VERSION}"'"/' Cargo.toml
          rm -f package.json.bak src-tauri/tauri.conf.json.bak Cargo.toml.bak
          echo "版本已同步为 ${VERSION}"
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      # 签名证书就绪后，在此追加 macOS 公证、Windows signtool 与 Linux 包签名步骤。
      - run: bun run tauri build -- --target ${{ matrix.target }}
        if: matrix.os == 'macos-latest'
      - run: bun run tauri build
        if: matrix.os != 'macos-latest'
      - name: 收集安装包
        shell: bash
        run: |
          # 交叉编译产物在 target/<triple>/release/bundle，host 构建在 target/release/bundle；
          # nullglob 让未命中的通配安全展开为空，找不到安装包时由
          # upload-artifact 报错，不在此吞掉失败。
          shopt -s nullglob
          mkdir -p release
          bundles=(target/release/bundle target/*/release/bundle)
          find "${bundles[@]}" \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \
            -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) \
            -exec cp {} release/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: kairos-${{ matrix.os }}-${{ matrix.target }}
          path: release/

  release:
    name: 创建 Release 草稿
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release/
      - uses: softprops/action-gh-release@v2
        with:
          # 标签不存在时，GitHub 会在 target_commitish（本次构建的提交）上创建它。
          draft: true
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
