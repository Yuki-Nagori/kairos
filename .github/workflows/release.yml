# T18 发布流水线：tag 推送 → 双平台构建 → Release 草稿（T18）

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与上传（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@master
        with:
          # 与 rust-toolchain.toml 钉版一致；否则交叉目标装在默认工具链上，
          # cargo 切到 1.95.0 后找不到 target（同 ci.yml 06:49 的修复）。
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      # 签名证书就绪后，在此追加 macOS 公证与 Windows signtool 步骤。
      - run: bun run tauri build -- --target ${{ matrix.target }}
        if: matrix.os == 'macos-latest'
      - run: bun run tauri build
        if: matrix.os == 'windows-latest'
      - name: 收集安装包
        shell: bash
        run: |
          # 交叉编译产物在 target/<triple>/release/bundle，host 构建在 target/release/bundle；
          # nullglob 让 Windows 下未命中的通配安全展开为空，找不到安装包时由
          # upload-artifact 报错，不在此吞掉失败。
          shopt -s nullglob
          mkdir -p release
          bundles=(target/release/bundle target/*/release/bundle)
          find "${bundles[@]}" \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) \
            -exec cp {} release/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: kairos-${{ matrix.os }}-${{ matrix.target }}
          path: release/

  release:
    name: 创建 Release 草稿
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release/
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
