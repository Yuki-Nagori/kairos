[package]
name = "kairos-tests"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
kairos-core = { path = "src-crates/kairos-core" }
serde = { workspace = true }
serde_json = "1"

[[test]]
name = "contract"
path = "tests/rust/contract/main.rs"

[workspace]
resolver = "2"
members = ["src-crates/kairos-core", "src-crates/kairos-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

# release 配置只能定义在工作区根目录（成员里的会被忽略）。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
